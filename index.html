        const fallbackCopy = () => {

            textArea.style.position = "fixed";
            textArea.style.top = "0";
            textArea.style.left = "0";

            textArea.select();

            setToastMsg("Ops, não consegui copiar.");
          }

            .then(() => {
              setToastMsg("Prontinho! Texto copiado.");
            })
            .catch(() => {
